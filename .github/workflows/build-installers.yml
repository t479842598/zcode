name: Build installers

# 双平台原生打包：macOS 在 macos runner 上产 dmg/zip，Windows 在 windows runner 上产 nsis 安装包。
# 不用在 mac 上交叉打 Windows —— 那需要 x86_64 wine，Apple Silicon 上跑不起来。
#
# 产物除安装包外还包含 electron-updater 自动更新所需的三件套：
#   - *.zip / *.dmg / *.exe  全量安装包
#   - *.blockmap             差分更新块映射（有它才能只下差量）
#   - latest-mac.yml / latest.yml  更新清单（自建更新服务直接托管，客户端按此拉取）
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（可选，默认取 package.json）"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle (mac arm64)
        env:
          # 正式身份包：不设则 resolveDesktopProductFlavor 走 fail-safe 默认 test，
          # 产出 ZCode Preview-*-_TEST 测试包，会被当正式版误传上 Release。
          ZCODE_ENV: production
        run: pnpm --filter @zcode/desktop bundle --os mac --arch arm64

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-macos-arm64
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error

  mac-x64:
    name: macOS (x64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle (mac x64)
        env:
          ZCODE_ENV: production
        run: pnpm --filter @zcode/desktop bundle --os mac --arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-macos-x64
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle (win x64)
        env:
          ZCODE_ENV: production
        run: pnpm --filter @zcode/desktop bundle --os win --arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-windows-x64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest.yml
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [mac, mac-x64, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: false
          generate_release_notes: true
